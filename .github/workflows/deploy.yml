name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5   # v4는 Node 20용(deprecated 경고). node24 선언된 v5로 (2026-10-18)

      - uses: actions/setup-node@v5   # node24 (2026-10-18)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6   # node24 (2026-10-18)
      - uses: actions/upload-pages-artifact@v5   # v4부터 점 파일 제외 — dist에 점 파일 없음 확인 (2026-10-18)
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5   # node24 (2026-10-18)
